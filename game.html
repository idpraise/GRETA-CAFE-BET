<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Greta's Café - Roll the Dice</title>
  <link rel="icon" href="images/Greta-transparent.png" type="image/png">
  <link rel="apple-touch-icon" href="images/Greta-transparent.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html {
      height: 100%;
      background: linear-gradient(180deg, #7b2d9f 0%, #e77c29 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #fff;
      overflow-x: hidden;
      position: relative;
    }

    /* SPARKLES */
    .sparkles {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      z-index: 1;
    }
    .sparkle {
      position: absolute;
      width: 8px; height: 8px;
      background: #ffd700;
      border-radius: 50%;
      opacity: 0;
      animation: sparkle 12s infinite linear;
    }
    @keyframes sparkle {
      0%   { transform: translateY(100vh) scale(0); opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: 0.8; }
      100% { transform: translateY(-50px) scale(1); opacity: 0; }
    }

    /* ALERT */
    .custom-alert-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.9);
      backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      opacity: 0;
      visibility: hidden;
      transition: all 0.4s;
    }
    .custom-alert-overlay.show { opacity: 1; visibility: visible; }
    .custom-alert {
      background: linear-gradient(135deg, #ff6b6b, #feca57);
      padding: 40px;
      border-radius: 28px;
      text-align: center;
      max-width: 90%;
      width: 420px;
      box-shadow: 0 25px 70px rgba(0,0,0,0.6);
      transform: scale(0.8);
      transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .custom-alert-overlay.show .custom-alert { transform: scale(1); }
    .custom-alert i { font-size: 4rem; color: white; margin-bottom: 20px; }
    .custom-alert p { font-size: 1.7rem; font-weight: 700; color: white; margin-bottom: 25px; line-height: 1.6; }
    .custom-alert .close-alert {
      padding: 14px 50px;
      background: rgba(255,255,255,0.3);
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 1.2rem;
      font-weight: bold;
      cursor: pointer;
    }

    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center;
      opacity: 0; visibility: hidden; transition: all 0.6s; z-index: 1000;
    }
    .modal-overlay.show { opacity: 1; visibility: visible; }
    .modal-content {
      background: rgba(255,255,255,0.15); backdrop-filter: blur(12px);
      padding: 50px 30px; border-radius: 24px; text-align: center; max-width: 90%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4); transform: scale(0.8); transition: transform 0.6s;
    }
    .modal-overlay.show .modal-content { transform: scale(1); }

    .modal-btn {
      padding: 16px 40px; font-size: 1.3rem; font-weight: bold; border: none;
      border-radius: 50px; cursor: pointer; transition: all 0.3s; margin: 10px;
    }
    .buy-coffee { background: #feca57; color: #333; }
    .maybe-later { background: transparent; border: 2px solid #fff; color: #fff; }
    .modal-btn:hover { transform: translateY(-4px); box-shadow: 0 10px 30px rgba(0,0,0,0.4); }

    #gretaCoffeeScreen {
      min-height: 100vh; display: none; flex-direction: column; align-items: center;
      justify-content: center; padding: 30px 50px 100px; /* Extra bottom padding for footer */
      text-align: center;
      background: linear-gradient(135deg, #6e1b8a 0%, #ee5a24 100%);
      position: relative; z-index: 2;
    }
    #gretaCoffeeScreen img {
      max-width: 380px; width: 90%; margin: 20px auto; border-radius: 24px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }
    #gretaCoffeeScreen h1 { font-size: 2.8rem; margin: 25px 0; }
    #gretaCoffeeScreen p { font-size: 1.6rem; margin-bottom: 30px; }

    .input-group { margin: 20px 0; text-align: left; max-width: 420px; width: 100%; }
    label { display: block; margin-bottom: 10px; font-weight: 600; font-size: 1.2rem; }
    input {
      width: 100%; padding: 18px 22px; border: none; border-radius: 18px;
      background: rgba(255,255,255,0.25); color: white; font-size: 1.15rem; backdrop-filter: blur(8px);
    }
    input::placeholder { color: rgba(255,255,255,0.75); }
    input:focus { outline: none; background: rgba(255,255,255,0.35); }
    input:disabled {
      background: rgba(255,255,255,0.15);
      color: #ccc;
      cursor: not-allowed;
      opacity: 0.7;
    }

    .button-group {
      display: flex;
      gap: 15px;
      margin-top: 30px;
      max-width: 420px;
      width: 100%;
    }
    .submit-btn, .exit-btn {
      flex: 1;
      padding: 18px 30px;
      font-size: 1.3rem;
      font-weight: bold;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }
    .submit-btn {
      background: #feca57; color: #333;
    }
    .exit-btn {
      background: rgba(255,255,255,0.2);
      color: white;
      border: 2px solid rgba(255,255,255,0.4);
    }
    .submit-btn:disabled { background: #444 !important; cursor: not-allowed; opacity: 0.8; }
    .submit-btn:hover:not(:disabled) {
      transform: translateY(-5px); background: #ff9f43; box-shadow: 0 15px 40px rgba(0,0,0,0.5);
    }
    .exit-btn:hover {
      background: rgba(255,255,255,0.3);
      transform: translateY(-5px);
    }

    .live-counter {
      background: rgba(0,0,0,0.35); padding: 25px; border-radius: 24px; margin: 30px auto;
      max-width: 420px; backdrop-filter: blur(12px); text-align: center;
    }
    .live-counter .big { font-size: 4.5rem; font-weight: bold; color: #feca57; }
    .live-counter .status { font-size: 1.4rem; margin-top: 10px; font-weight: 500; }

    .wallet-status {
      background: rgba(0,0,0,0.4);
      padding: 20px;
      border-radius: 20px;
      margin: 20px auto;
      max-width: 420px;
      text-align: center;
      backdrop-filter: blur(10px);
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .wallet-status.show {
      opacity: 1;
      transform: translateY(0);
    }
    .wallet-status .address {
      font-family: 'Courier New', monospace;
      font-size: 1.4rem;
      font-weight: bold;
      color: #feca57;
      margin: 10px 0;
    }
    .disconnect-btn {
      background: rgba(255,255,255,0.2);
      color: white;
      border: 1px solid rgba(255,255,255,0.3);
      padding: 10px 20px;
      border-radius: 50px;
      font-size: 0.9rem;
      cursor: pointer;
      margin-top: 10px;
    }

    /* DICE NUMBER OVERLAY */
    .dice-number {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-size: 9rem;
      font-weight: bold;
      color: #222;
      text-shadow: 0 0 30px rgba(255,255,255,0.8);
      z-index: 10;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.6s;
    }
    .dice-number.show { opacity: 1; }

    /* EPIC 3D DICE */
    .dice-container {
      perspective: 1200px;
      width: clamp(240px, 70vw, 340px);
      height: clamp(240px, 70vw, 340px);
      margin: 40px auto;
      display: none;
      position: relative;
    }
    .dice {
      width: 100%; height: 100%; position: relative;
      transform-style: preserve-3d;
      transition: transform 4s cubic-bezier(0.2, 0.85, 0.3, 1);
    }
    .face {
      position: absolute; width: 100%; height: 100%;
      background: linear-gradient(135deg, #ffffff 0%, #f5f5f5 100%);
      border: 10px solid #222; border-radius: 24px;
      display: flex; align-items: center; justify-content: center;
      backface-visibility: hidden;
      box-shadow: inset 0 0 80px rgba(0,0,0,0.4), 0 30px 60px rgba(0,0,0,0.7);
    }
    .dot { width: 28%; height: 28%; background: #222; border-radius: 50%; box-shadow: inset 0 8px 16px rgba(0,0,0,0.6); }
    .dots { display: grid; width: 80%; height: 80%; gap: 12%; padding: 10%; }
    .one   .dots { grid-template: "a . ." ". b ." ". . c"; }
    .two   .dots { grid-template: "a . ." ". . ." ". . b"; }
    .three .dots { grid-template: "a . ." ". b ." ". . c"; }
    .four  .dots { grid-template: "a b" "c d"; }
    .five  .dots { grid-template: "a b" ". e ." "c d"; }
    .six   .dots { grid-template: "a b" "c d" "e f"; }
    .front  { transform: translateZ(170px); }
    .back   { transform: rotateY(180deg) translateZ(170px); }
    .right  { transform: rotateY(90deg) translateZ(170px); }
    .left   { transform: rotateY(-90deg) translateZ(170px); }
    .top    { transform: rotateX(90deg) translateZ(170px); }
    .bottom { transform: rotateX(-90deg) translateZ(170px); }

    /* POWERED BY SNAPPQUEST - NATURAL FLOW FOOTER */
    .powered-by {
      margin-top: 60px;
      padding: 20px;
      text-align: center;
      font-size: 0.95rem;
      color: #ccc;
      opacity: 0.9;
      transition: all 0.3s ease;
    }
    .powered-by:hover {
      opacity: 1;
      color: #fff;
    }
    .powered-by a {
      color: #feca57;
      text-decoration: none;
      font-weight: bold;
      margin: 0 6px;
    }
    .powered-by a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="sparkles" id="sparkles"></div>

  <div class="custom-alert-overlay" id="customAlert">
    <div class="custom-alert">
      <i class="fas fa-trophy"></i>
      <p id="alertMessage">Rolling...</p>
      <button class="close-alert" onclick="closeCustomAlert()">Close</button>
    </div>
  </div>

  <div class="modal-overlay show" id="welcomeModal">
    <div class="modal-content">
      <h1>Savor the sweet coffee brews</h1>
      <p>Grab a coffee to roll the dice!</p>
      <div style="display:flex;flex-direction:column;gap:25px;margin-top:40px;">
        <button class="modal-btn buy-coffee" id="buyCoffeeBtn">BUY COFFEE</button>
        <button class="modal-btn maybe-later" id="maybeLaterBtn">MAYBE LATER</button>
      </div>
    </div>
  </div>

  <div id="gretaCoffeeScreen">
    <img src="images/Greta-transparent.png" alt="Here's your coffee!">
    <h1>Here's your coffee!</h1>
    <p id="infoText">Enter your info below to roll the dice:</p>

    <div class="live-counter">
      <div class="big"><span id="liveCounter">0</span><span style="font-size:2.2rem;opacity:0.7;">/6</span></div>
      <div class="status" id="statusText">Loading players...</div>
    </div>

    <!-- CONNECTED STATE -->
    <div id="connectedStatus" class="wallet-status">
      <div>Connected</div>
      <div class="address" id="shortAddress"></div>
      <div>Telegram <span id="shortTelegram"></span></div>
      <button class="disconnect-btn" id="disconnectBtn">Disconnect Wallet</button>
    </div>

    <!-- INPUTS -->
    <div id="inputSection">
      <div class="input-group">
        <label for="telegramInput">Telegram Handle</label>
        <input type="text" id="telegramInput" placeholder="@yourusername" />
      </div>
      <div class="input-group">
        <label for="polygonInput">Polygon Address</label>
        <input type="text" id="polygonInput" placeholder="0x..." />
      </div>
    </div>

    <!-- DICE WITH BIG NUMBER OVERLAY -->
    <div class="dice-container" id="diceContainer">
      <div class="dice" id="dice">
        <div class="face front"><div class="dots one"><div class="dot" style="grid-area: b;"></div></div></div>
        <div class="face back"><div class="dots two"><div class="dot" style="grid-area: a;"></div><div class="dot" style="grid-area: b;"></div></div></div>
        <div class="face right"><div class="dots three"><div class="dot" style="grid-area: a;"></div><div class="dot" style="grid-area: b;"></div><div class="dot" style="grid-area: c;"></div></div></div>
        <div class="face left"><div class="dots four"><div class="dot" style="grid-area: a;"></div><div class="dot" style="grid-area: b;"></div><div class="dot" style="grid-area: c;"></div><div class="dot" style="grid-area: d;"></div></div></div>
        <div class="face top"><div class="dots five"><div class="dot" style="grid-area: a;"></div><div class="dot" style="grid-area: b;"></div><div class="dot" style="grid-area: c;"></div><div class="dot" style="grid-area: d;"></div><div class="dot" style="grid-area: e;"></div></div></div>
        <div class="face bottom"><div class="dots six"><div class="dot" style="grid-area: a;"></div><div class="dot" style="grid-area: b;"></div><div class="dot" style="grid-area: c;"></div><div class="dot" style="grid-area: d;"></div><div class="dot" style="grid-area: e;"></div><div class="dot" style="grid-area: f;"></div></div></div>
      </div>
      <div class="dice-number" id="diceNumber"></div>
    </div>

    <!-- BUTTON GROUP -->
    <div class="button-group">
      <button class="submit-btn" id="submitDiceRoll">Submit & Roll Dice</button>
      <button class="exit-btn" id="exitGameBtn">Exit Game</button>
    </div>

    <!-- POWERED BY SNAPPQUEST - NATURAL FLOW FOOTER -->
    <div class="powered-by">
      Powered by <a href="https://snappquest.niti.com.ng/" target="_blank">SnappQuest</a>
    </div>
  </div>

  <form id="googleForm" action="https://docs.google.com/forms/d/e/1FAIpQLSeScqtPJIoOIio2zw_Jb951MaXaLXfoOpvqkIeYpRMRAyqb0g/formResponse" method="POST" target="hidden_iframe" style="display:none;">
    <input type="text" name="entry.647719580" id="entry_trackcode">
    <input type="text" name="entry.1396080383" id="entry_telegram">
    <input type="text" name="entry.1707728293" id="entry_polygon">
    <input type="text" name="entry.522687597" id="entry_outcome">
    <input type="text" name="entry.1098884549" id="entry_spin">
  </form>
  <iframe name="hidden_iframe" style="display:none;"></iframe>

  <script>
    // Sparkles
    for(let i = 0; i < 40; i++) {
      const s = document.createElement('div');
      s.className = 'sparkle';
      s.style.left = Math.random() * 100 + 'vw';
      s.style.animationDelay = Math.random() * 10 + 's';
      document.getElementById('sparkles').appendChild(s);
    }

    const API_KEY = "AIzaSyDseGK7WIi6hUGD_1Oz8cweDraAQpFisoQ";
    const SHEET_ID = "14iVkVTRuo1FAueggKB_rai0471Mq-ZLu2wi4_Wu1htY";
    const RANGE = "Form Responses 1!A:Z";

    const alertOverlay = document.getElementById('customAlert');
    const alertMessage = document.getElementById('alertMessage');
    const submitBtn = document.getElementById('submitDiceRoll');
    const exitBtn = document.getElementById('exitGameBtn');
    const diceContainer = document.getElementById('diceContainer');
    const dice = document.getElementById('dice');
    const diceNumber = document.getElementById('diceNumber');
    const liveCounter = document.getElementById('liveCounter');
    const statusText = document.getElementById('statusText');
    const inputSection = document.getElementById('inputSection');
    const connectedStatus = document.getElementById('connectedStatus');
    const shortAddress = document.getElementById('shortAddress');
    const shortTelegram = document.getElementById('shortTelegram');
    const infoText = document.getElementById('infoText');
    const telegramInput = document.getElementById('telegramInput');
    const polygonInput = document.getElementById('polygonInput');
    let isSubmitting = false;

    function truncateAddress(addr) {
      if (!addr || addr.length < 11) return addr;
      return `${addr.slice(0, 6)}...${addr.slice(-4)}`;
    }

    function connectWallet(tg, poly) {
      localStorage.setItem('greta_telegram', tg);
      localStorage.setItem('greta_polygon', poly);

      shortAddress.textContent = truncateAddress(poly);
      shortTelegram.textContent = tg;
      connectedStatus.classList.add('show');
      inputSection.style.opacity = '0';
      setTimeout(() => {
        inputSection.style.display = 'none';
        connectedStatus.style.display = 'block';
      }, 400);

      infoText.textContent = "You're connected! Ready to roll.";
      submitBtn.textContent = "Roll Dice Now";

      telegramInput.value = tg;
      polygonInput.value = poly;
      telegramInput.disabled = true;
      polygonInput.disabled = true;
    }

    function checkConnection() {
      const savedTelegram = localStorage.getItem('greta_telegram');
      const savedPolygon = localStorage.getItem('greta_polygon');

      if (savedTelegram && savedPolygon) {
        connectWallet(savedTelegram, savedPolygon);
      }
    }

    document.getElementById('disconnectBtn').onclick = () => {
      localStorage.removeItem('greta_telegram');
      localStorage.removeItem('greta_polygon');
      location.href = "index.html";
    };

    exitBtn.onclick = () => {
      location.href = "index.html";
    };

    const diceRotations = {
      1: 'rotateX(0deg) rotateY(0deg)',
      2: 'rotateX(-90deg) rotateY(0deg)',
      3: 'rotateX(0deg) rotateY(-90deg)',
      4: 'rotateX(0deg) rotateY(90deg)',
      5: 'rotateX(90deg) rotateY(0deg)',
      6: 'rotateX(180deg) rotateY(0deg)'
    };

    function showAlert(msg) {
      alertMessage.innerHTML = msg;
      alertOverlay.classList.add('show');
    }
    function closeCustomAlert() { alertOverlay.classList.remove('show'); }

    function generateTrackCode() {
      const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
      let code = "";
      for (let i = 0; i < 4; i++) code += chars.charAt(Math.floor(Math.random() * chars.length));
      return code;
    }

    async function getGameState() {
      try {
        const url = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${RANGE}?key=${API_KEY}`;
        const res = await fetch(url);
        const data = await res.json();
        const rows = data.values || [];
        const entries = rows.slice(1);
        const totalEntries = entries.length;
        const usedNumbers = entries.map(r => parseInt(r[4] || "")).filter(n => n >= 1 && n <= 6);
        const available = [1,2,3,4,5,6].filter(n => !usedNumbers.includes(n));
        const winners = entries.filter(r => r[5] === "1").length;
        return { totalEntries, available, winners };
      } catch (e) {
        return { totalEntries: 0, available: [1,2,3,4,5,6], winners: 0 };
      }
    }

    async function updateUI() {
      const s = await getGameState();
      liveCounter.textContent = s.totalEntries;
      if (s.totalEntries >= 6) {
        liveCounter.style.color = "#ff4444";
        statusText.innerHTML = "<span style='color:#ff8888'>GAME FULL — 6/6 taken</span>";
        submitBtn.disabled = true;
        submitBtn.textContent = "GAME FULL";
      } else {
        liveCounter.style.color = "#feca57";
        const left = 6 - s.totalEntries;
        statusText.innerHTML = `<span style='color:#aaffaa'>${left} spot${left>1?'s':''} left — Go!</span>`;
        submitBtn.disabled = false;
      }
    }

    async function rollDice(finalNumber) {
      diceContainer.style.display = 'block';
      diceNumber.textContent = "";
      diceNumber.classList.remove('show');
      submitBtn.textContent = "ROLLING THE DICE...";
      submitBtn.disabled = true;

      const spins = 14 + Math.random() * 6;
      const randX = spins * 360 + Math.random() * 720;
      const randY = spins * 360 + Math.random() * 720;

      dice.style.transform = `rotateX(${randX}deg) rotateY(${randY}deg)`;

      setTimeout(() => {
        dice.style.transition = 'transform 1.4s cubic-bezier(0.2, 0.9, 0.3, 1)';
        dice.style.transform = diceRotations[finalNumber];

        setTimeout(() => {
          diceNumber.textContent = finalNumber;
          diceNumber.classList.add('show');
        }, 800);
      }, 4200);
    }

    setInterval(updateUI, 4000);
    updateUI();

    document.addEventListener("DOMContentLoaded", () => {
      checkConnection();

      document.getElementById('buyCoffeeBtn').onclick = async () => {
        const s = await getGameState();
        if (s.totalEntries >= 6) { showAlert("Game is full!"); return; }
        document.getElementById('welcomeModal').classList.remove('show');
        setTimeout(() => {
          document.getElementById('welcomeModal').style.display = 'none';
          document.getElementById('gretaCoffeeScreen').style.display = 'flex';
          updateUI();
        }, 600);
      };

      document.getElementById('maybeLaterBtn').onclick = () => location.href = "index.html";

      submitBtn.onclick = async () => {
        if (isSubmitting) return;
        isSubmitting = true;

        let tg, poly;

        if (localStorage.getItem('greta_telegram') && localStorage.getItem('greta_polygon')) {
          tg = localStorage.getItem('greta_telegram');
          poly = localStorage.getItem('greta_polygon');
        } else {
          tg = telegramInput.value.trim();
          poly = polygonInput.value.trim();

          if (!tg || !poly) { showAlert("Fill both fields!"); isSubmitting = false; return; }
          if (!tg.startsWith('@')) { showAlert("Telegram must start with @"); isSubmitting = false; return; }
          if (!poly.startsWith('0x') || poly.length < 30) { showAlert("Invalid Polygon address"); isSubmitting = false; return; }

          connectWallet(tg, poly);
        }

        const state = await getGameState();
        if (state.totalEntries >= 6) {
          showAlert("Game just filled up!");
          await updateUI();
          isSubmitting = false;
          return;
        }

        const outcome = state.available[Math.floor(Math.random() * state.available.length)];
        const spinValue = state.winners < 3 && (state.totalEntries >= 3 || Math.random() < 0.5) ? "1" : "0";
        const trackCode = generateTrackCode();

        await rollDice(outcome);

        document.getElementById('entry_trackcode').value = trackCode;
        document.getElementById('entry_telegram').value = tg;
        document.getElementById('entry_polygon').value = poly;
        document.getElementById('entry_outcome').value = outcome;
        document.getElementById('entry_spin').value = spinValue;
        document.getElementById('googleForm').submit();

        setTimeout(() => {
          const msg = spinValue === "1"
            ? `JACKPOT!<br><br>You rolled a <b>${outcome}</b><br><br>YOU WON THE PRIZE!`
            : `You rolled a <b>${outcome}</b><br><br>Better luck next time!`;

          showAlert(msg);

          setTimeout(() => {
            diceContainer.style.display = 'none';
            diceNumber.classList.remove('show');
            updateUI();
            isSubmitting = false;
            submitBtn.textContent = "Roll Dice Now";
          }, 4000);
        }, 5600);
      };
    });
  </script>
</body>
</html>
